# The "after" half of a two-part demo: identical to docker-compose.yml in
# every way except one line (backend's build path) — the story being "a
# developer swapped bcryptjs for native bcrypt in expense-backend-v1.2.1,
# nothing else about the deployment changed." Meant to be run sequentially
# against the SAME already-running stack, not standalone or side by side:
#
#   docker compose up -d --build                          # 1. show the "before" state on v1.2
#   ...discuss the bcrypt.hash span, the p99 panel, the tradeoffs...
#   docker compose -f docker-compose.v1.2.1.yml up -d --build backend
#                                                           # 2. swap only the backend, "after"
#
# Container name, network name, and every other service are identical on
# purpose, so that second command recreates just the backend container in
# place — mysql/prometheus/grafana/tempo/otel-collector keep running
# untouched throughout, same as a real backend-only deploy would look like.
# No changes needed to scripts/healthy-load.sh or fault-load.sh — both talk
# only to nginx's public /api/ surface, never to the backend directly, so
# they're unaffected by which backend image is actually running underneath.
services:
  mysql:
    build: ../expense-mysql-v1
    container_name: expense-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: expense_tracker
      MYSQL_USER: expense_app
      MYSQL_PASSWORD: devpass
    volumes:
      - expense_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../expense-backend-v1.2.1
    container_name: backend
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: expense_app
      DB_PASSWORD: devpass
      DB_NAME: expense_tracker
      DB_POOL_SIZE: 10
      JWT_SECRET: change-me-to-a-long-random-string
      JWT_EXPIRES_IN: 7d
      FRONTEND_ORIGIN: http://localhost
      AUTH_MODE: cookie
    depends_on:
      mysql:
        condition: service_healthy
      otel-collector:
        condition: service_started

  frontend:
    build: ../expense-frontend-v1.2
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - otel-collector

  # --- Metrics collection ---

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld-exporter
    command:
      - --config.my-cnf=/etc/mysqld-exporter/.my.cnf
    volumes:
      - ./mysqld-exporter/.my.cnf:/etc/mysqld-exporter/.my.cnf:ro
    depends_on:
      mysql:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    command:
      - --nginx.scrape-uri=http://frontend:8080/stub_status
    depends_on:
      - frontend

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    cgroup: host
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    command:
      - --containerd=/run/containerd/containerd.sock
      - --containerd-namespace=moby
    depends_on:
      - backend
      - frontend
      - mysql

  otel-collector:
    image: otel/opentelemetry-collector:0.160.0
    container_name: otel-collector
    command:
      - --config=/etc/otel-collector-config.yaml
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:3.0.3
    container_name: tempo
    command:
      - -target=all
      - -config.file=/etc/tempo.yaml
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --storage.tsdb.retention.time=35d
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./prometheus/slo-rules.yml:/etc/prometheus/slo-rules.yml:ro
      - ./prometheus/slo-burn-rate-alerts.yml:/etc/prometheus/slo-burn-rate-alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - frontend
      - mysqld-exporter
      - nginx-exporter
      - node-exporter
      - cadvisor
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  expense_mysql_data:

networks:
  default:
    name: expense-v2-traces-net
